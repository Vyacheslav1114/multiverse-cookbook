<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Multiverse Cookbook</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-title { font-family: 'Cinzel', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex justify-center items-center p-0 sm:p-4">

    <div id="app" class="w-full max-w-md bg-zinc-900 sm:rounded-3xl shadow-2xl overflow-hidden border border-zinc-800 flex flex-col h-screen sm:h-[844px] relative">
        
        <!-- Шапка -->
        <!-- Шапка -->
        <header class="bg-zinc-900/90 backdrop-blur border-b border-zinc-800 p-4 sticky top-0 z-20 flex items-center justify-between">
            <div>
                <h1 class="font-title text-lg tracking-wider text-amber-500">MULTIVERSE COOKBOOK</h1>
                <p class="text-[11px] text-zinc-400">Полная энциклопедия гик-рецептов</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- 🎲 Кнопка случайного рецепта -->
                <button onclick="openRandomRecipe()" title="Случайный рецепт" class="text-xs bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-full transition flex items-center gap-1 cursor-pointer">
    <span>🎲</span>
    <span class="hidden sm:inline">Случайный</span>
</button>
                <span id="recipeCounter" class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-full font-mono">0 рецептов</span>
            </div>
        </header>

        <!-- Поиск и фильтры -->
        <div class="p-4 bg-zinc-900 border-b border-zinc-800/80 space-y-2.5 z-10">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Название, ингредиент или миры..." 
                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition">
                <svg class="w-4 h-4 text-zinc-500 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            
            <!-- Фильтр по вселенным -->
            <div id="universeFilter" class="flex gap-2 overflow-x-auto no-scrollbar items-center text-xs h-9"></div>

            <!-- Фильтр по категориям (+ Избранное) -->
            <div id="categoryFilter" class="flex gap-1.5 overflow-x-auto no-scrollbar items-center border-t border-zinc-800/60 pt-2 text-xs h-9"></div>
        </div>

        <!-- Список рецептов -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4" id="recipeList"></main>
    </div>

    <!-- Модалка -->
    <div id="recipeModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-zinc-900 w-full max-w-md sm:rounded-3xl rounded-t-3xl border border-zinc-800 max-h-[90vh] flex flex-col overflow-hidden relative">
            
            <div class="relative h-48 w-full bg-zinc-950 shrink-0">
                <img id="modalImage" class="w-full h-full object-cover" src="" alt="">
                <div class="absolute inset-0 bg-gradient-to-t from-zinc-900 via-transparent to-black/40"></div>
                
                <div class="absolute top-3 right-3 flex items-center gap-2">
                    <button id="modalFavBtn" class="p-2 rounded-full bg-black/60 backdrop-blur border border-white/10 text-zinc-300 hover:text-white transition">
                        <svg id="modalFavIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </button>
                    <button onclick="closeModal()" class="text-zinc-300 hover:text-white p-2 rounded-full bg-black/60 backdrop-blur border border-white/10">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="absolute bottom-3 left-4 right-4">
                    <span id="modalUniverseTag" class="text-[10px] font-mono uppercase px-2 py-0.5 rounded border"></span>
                    <h2 id="modalTitle" class="font-title text-xl text-white mt-1 drop-shadow"></h2>
                </div>
            </div>

            <div class="p-5 overflow-y-auto space-y-5 text-sm text-zinc-300">
                <p id="modalCanon" class="text-xs italic text-zinc-400 bg-zinc-950/60 p-3 rounded-xl border border-zinc-800/60"></p>

                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-800 text-center">
                        <span class="text-zinc-500 block">Время</span>
                        <span id="modalTime" class="font-semibold text-zinc-200"></span>
                    </div>
                    <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-800 text-center">
                        <span class="text-zinc-500 block">Сложность</span>
                        <span id="modalDifficulty" class="font-semibold text-zinc-200"></span>
                    </div>
                </div>

                <div>
                    <h3 class="font-bold text-amber-500 uppercase tracking-wider text-xs mb-2.5">Ингредиенты</h3>
                    <ul id="modalIngredients" class="space-y-1.5 text-xs"></ul>
                </div>

                <div>
                    <h3 class="font-bold text-amber-500 uppercase tracking-wider text-xs mb-2.5">Подробный рецепт</h3>
                    <ol id="modalSteps" class="space-y-3 text-xs"></ol>
                </div>
            </div>
        </div>
    </div>

    <script>
        let database = [];
        let selectedUniverses = []; 
        let activeCategory = 'ALL';
        
        let favorites = JSON.parse(localStorage.getItem('cookbook_favorites') || '[]');
        let currentModalRecipeId = null;

        const recipeList = document.getElementById('recipeList');
        const searchInput = document.getElementById('searchInput');
        const universeFilter = document.getElementById('universeFilter');
        const categoryFilter = document.getElementById('categoryFilter');
        const recipeModal = document.getElementById('recipeModal');
        const modalFavBtn = document.getElementById('modalFavBtn');

        async function loadRecipes() {
            try {
                const res = await fetch('recipes.json');
                database = await res.json();
                renderUniverseFilters();
                renderCategoryFilters();
                renderRecipes();
            } catch (err) {
                recipeList.innerHTML = `<div class="text-center py-12 text-red-400 text-sm">Ошибка загрузки recipes.json.<br>Запусти проект через Live Server!</div>`;
            }
        }

        function toggleFavorite(id, event) {
            if (event) event.stopPropagation();
            
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            
            localStorage.setItem('cookbook_favorites', JSON.stringify(favorites));
            
            renderCategoryFilters();
            renderRecipes();
            
            if (currentModalRecipeId === id) {
                updateModalFavBtn(id);
            }
        }

        function renderUniverseFilters() {
            const universes = ['ALL', ...new Set(database.map(r => r.universe))];
            
            universeFilter.innerHTML = universes.map(u => {
                const isAll = u === 'ALL';
                const isActive = isAll ? selectedUniverses.length === 0 : selectedUniverses.includes(u);

                let btnClass = '';
                if (isAll) {
                    btnClass = isActive 
                        ? 'bg-amber-500 text-black font-semibold border-amber-500' 
                        : 'bg-zinc-950 text-zinc-400 border-zinc-800 hover:border-zinc-700';
                } else {
                    // Берем точный стиль (universeBadge) из первого попавшегося рецепта этой вселенной
                    const sampleRecipe = database.find(r => r.universe === u);
                    const badgeStyle = sampleRecipe ? sampleRecipe.universeBadge : 'bg-zinc-800 text-zinc-300 border-zinc-700';

                    if (isActive) {
                        // Активная кнопка берет оригинальный стиль карточки + жирный шрифт
                        btnClass = `${badgeStyle} font-bold shadow-md`;
                    } else {
                        // Неактивная — приглушенная темная
                        btnClass = 'bg-zinc-950 text-zinc-400 border-zinc-800 hover:border-zinc-700';
                    }
                }

                return `
                    <button onclick="setUniverse('${u}')" 
                        class="px-3 py-1 rounded-xl whitespace-nowrap transition border text-xs ${btnClass}">
                        ${isAll ? 'Все миры' : u}
                    </button>
                `;
            }).join('');
        }

        function renderCategoryFilters() {
            const categories = ['ALL', 'FAVORITES', ...new Set(database.map(r => r.category).filter(Boolean))];
            categoryFilter.innerHTML = categories.map(cat => {
                const isAll = cat === 'ALL';
                const isFav = cat === 'FAVORITES';
                const isActive = cat === activeCategory;

                let label = isAll ? 'Все блюда' : (isFav ? `❤️ Избранное (${favorites.length})` : cat);

                return `
                    <button onclick="setCategory('${cat}')" 
                        class="px-2.5 py-1 rounded-xl whitespace-nowrap transition border text-[11px] ${
                            isActive 
                            ? 'bg-amber-500/20 text-amber-400 border-amber-500/50 font-medium'
                            : 'bg-zinc-950 text-zinc-400 border-zinc-800 hover:border-zinc-700'
                        }">
                        ${label}
                    </button>
                `;
            }).join('');
        }

        function getFilteredRecipes() {
            const rawQuery = searchInput.value.toLowerCase().trim();
            const checkUniverse = (r) => selectedUniverses.length === 0 || selectedUniverses.includes(r.universe);
            
            const checkCategory = (r) => {
                if (activeCategory === 'FAVORITES') {
                    return favorites.includes(r.id || r.title);
                }
                return activeCategory === 'ALL' || r.category === activeCategory;
            };

            if (!rawQuery) {
                return database.filter(r => checkUniverse(r) && checkCategory(r));
            }

            const normalizedQuery = rawQuery
                .replace(/куриц[аеуыяої]?/g, 'кури')
                .replace(/курин[оеаыяумі]?/g, 'кури');

            const queryWords = normalizedQuery.split(/\s+/).filter(Boolean);

            return database.filter(r => {
                const matchesUniverse = checkUniverse(r);
                const matchesCategory = checkCategory(r);
                
                const ingredientsText = Array.isArray(r.ingredients) ? r.ingredients.join(' ') : (r.ingredients || '');
                const titleText = r.title || r.name || '';
                const universeText = r.universe || '';
                
                const fullRecipeText = `${titleText} ${universeText} ${ingredientsText}`
                    .toLowerCase()
                    .replace(/куриц[аеуыяої]?/g, 'кури')
                    .replace(/курин[оеаыяумі]?/g, 'кури');

                const recipeWords = fullRecipeText.split(/\s+/).filter(Boolean);
                
                const matchesSearch = queryWords.every(queryWord => {
                    return recipeWords.some(recipeWord => recipeWord.startsWith(queryWord));
                });

                return matchesUniverse && matchesCategory && matchesSearch;
            });
        }

        function renderRecipes() {
            const items = getFilteredRecipes();
            document.getElementById('recipeCounter').innerText = `${items.length} рецептов`;
            
            recipeList.innerHTML = '';
            if (items.length === 0) {
                const emptyMsg = activeCategory === 'FAVORITES' 
                    ? 'У вас пока нет избранных рецептов...<br>Нажмите ❤️ на карточке, чтобы добавить!' 
                    : 'Рецепты не найдены...';
                recipeList.innerHTML = `<div class="text-center py-12 text-zinc-500 text-sm">${emptyMsg}</div>`;
                return;
            }

            items.forEach(recipe => {
                const recipeId = recipe.id || recipe.title;
                const isFav = favorites.includes(recipeId);

                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 hover:border-zinc-700 rounded-2xl overflow-hidden cursor-pointer transition group shadow-md relative";
                card.onclick = () => openModal(recipe);
                card.innerHTML = `
                    <div class="h-36 w-full relative overflow-hidden bg-zinc-950">
                        <img src="${recipe.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${recipe.title}">
                        <div class="absolute inset-0 bg-gradient-to-t from-zinc-900 via-transparent to-transparent"></div>
                        <span class="absolute top-3 left-3 text-[10px] font-mono px-2 py-0.5 rounded border backdrop-blur bg-black/40 ${recipe.universeBadge}">${recipe.universe}</span>
                        
                        <button onclick="toggleFavorite('${recipeId}', event)" class="absolute top-3 right-3 p-1.5 rounded-full bg-black/50 backdrop-blur border border-white/10 ${isFav ? 'text-red-500' : 'text-zinc-400 hover:text-white'} transition">
                            <svg class="w-4 h-4" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </button>
                    </div>
                    <div class="p-3.5 space-y-1">
                        <h3 class="font-medium text-zinc-100 group-hover:text-amber-400 transition text-sm">${recipe.title}</h3>
                        <div class="flex justify-between text-[11px] text-zinc-400 pt-1">
                            <span>⏱ ${recipe.time}</span>
                            <span>🔥 ${recipe.difficulty}</span>
                        </div>
                    </div>
                `;
                recipeList.appendChild(card);
            });
        }

        function setUniverse(u) {
            if (u === 'ALL') {
                selectedUniverses = []; 
            } else {
                if (selectedUniverses.includes(u)) {
                    selectedUniverses = selectedUniverses.filter(item => item !== u);
                } else {
                    selectedUniverses.push(u);
                }
            }
            renderUniverseFilters();
            renderRecipes();
        }

        function setCategory(cat) {
            if (activeCategory === cat) {
                activeCategory = 'ALL';
            } else {
                activeCategory = cat;
            }
            renderCategoryFilters();
            renderRecipes();
        }

        function updateModalFavBtn(recipeId) {
            const isFav = favorites.includes(recipeId);
            modalFavBtn.onclick = () => toggleFavorite(recipeId);
            modalFavBtn.className = `p-2 rounded-full backdrop-blur border border-white/10 transition ${isFav ? 'bg-red-500/20 text-red-500 border-red-500/30' : 'bg-black/60 text-zinc-300 hover:text-white'}`;
            modalFavBtn.querySelector('svg').setAttribute('fill', isFav ? 'currentColor' : 'none');
        }

        function openModal(recipe) {
            const recipeId = recipe.id || recipe.title;
            currentModalRecipeId = recipeId;

            document.getElementById('modalImage').src = recipe.image;
            document.getElementById('modalTitle').innerText = recipe.title;
            document.getElementById('modalUniverseTag').innerText = recipe.universe;
            document.getElementById('modalUniverseTag').className = `text-[10px] font-mono uppercase px-2 py-0.5 rounded border ${recipe.universeBadge}`;
            document.getElementById('modalCanon').innerText = recipe.canon;
            document.getElementById('modalTime').innerText = recipe.time;
            document.getElementById('modalDifficulty').innerText = recipe.difficulty;

            updateModalFavBtn(recipeId);

            document.getElementById('modalIngredients').innerHTML = recipe.ingredients.map(ing => `
                <li onclick="this.classList.toggle('line-through'); this.classList.toggle('text-zinc-600')" 
                    class="bg-zinc-950 p-2.5 rounded-lg border border-zinc-800/80 cursor-pointer transition flex items-center justify-between">
                    <span>${ing}</span>
                    <span class="text-zinc-700 text-[10px]">✓</span>
                </li>
            `).join('');

            document.getElementById('modalSteps').innerHTML = recipe.steps.map((step, idx) => `
                <li class="flex gap-3 bg-zinc-950/60 p-3 rounded-xl border border-zinc-800/60">
                    <span class="font-mono text-amber-500 font-bold text-xs">${idx + 1}.</span>
                    <span class="text-zinc-300 leading-relaxed">${step}</span>
                </li>
            `).join('');

            recipeModal.classList.remove('hidden');

            recipeModal.querySelector('.overflow-y-auto').scrollTop = 0;
        }

        function closeModal() {
            recipeModal.classList.add('hidden');
            currentModalRecipeId = null;
        }

        searchInput.addEventListener('input', renderRecipes);
        recipeModal.addEventListener('click', (e) => { if (e.target === recipeModal) closeModal(); });

        loadRecipes();

        // Функция рандомного выбора рецепта
        function openRandomRecipe() {
            // Берем текущие отфильтрованные рецепты (если включен поиск или фильтр, 
            // рандом выпадет среди них; если нет — среди всей базы)
            const currentItems = getFilteredRecipes();
            
            if (currentItems.length === 0) {
                alert('Нет доступных рецептов для выбора!');
                return;
            }

            // Выбираем случайный элемент из массива
            const randomIndex = Math.floor(Math.random() * currentItems.length);
            const randomRecipe = currentItems[randomIndex];

            // Открываем его модальное окно
            openModal(randomRecipe);
        }
    </script>
</body>
</html>
